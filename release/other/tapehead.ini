; Tapehead Edition advanced configuration
; Changes are loaded when the program starts.
; Invalid or missing values use the safe built-in defaults.

[Video]

; Experimental crisp HD renderer. The layout and mouse map stay exactly
; 632x400, but the final image is rebuilt at 2x or 3x resolution.
; Disable this here if the HD window is unsuitable for the current display.
HDMode=true

; Accepted values: 2 or 3. The window is safely reduced if it cannot fit.
HDScale=3

; crisp keeps FT2's square geometry while applying restrained diagonal cleanup.
; round restores the softer HD v1 filter. The old sharp name is accepted as
; an alias for crisp so existing experimental configurations remain valid.
; Accepted values: crisp, sharp or round.
HDStyle=crisp

[Launcher]

; Startup window. Accepted values: tracker or deck_matrix.
; Change this to tracker to open the normal FT2 editor at startup.
StartWindow=tracker

[DiskOp]

; Format shown in the middle Sample save slot. Accepted values: EXS or IFF.
; EXS opens the XM sample-set exporter; IFF restores the legacy IFF saver.
SampleExportSlot=EXS

[Keyboard]

; Backspace navigates to the parent directory while Disk Op is open.
DiskOpBackspaceParent=false

; Backspace deletes the current note row and pulls later notes upward.
PatternBackspacePullUp=false

[Audio]

; Logical stereo output buses requested from the selected audio device or
; exposed as separate ports by "Tapehead JACK Virtual Outputs" on Linux.
; 1 is ordinary stereo; accepted range is 1-16 (2-32 output channels).
; Unsupported multichannel modes safely fall back to stereo.
OutputBuses=1

; Route each tracker lane to one physical mono output instead of a stereo bus.
; The Config -> Audio checkbox can also change this while FT2 is running.
MonoOutputs=false

[MIDI]

; Enables device-independent MIDI performance mappings below.
; The dedicated surface ports are separate from Config > MIDI Input and MIDI
; Dub, so a musical keyboard and the control surface can be used together.
PerformanceControl=true

; None keeps the generic INI map. APC40MK2 installs Tapehead's built-in Akai
; layout, switches the controller to host-controlled Mode 2, and enables LEDs.
Profile=APC40MK2

; Exact RtMidi device names are preferred. A unique partial name is also
; accepted, which avoids volatile ALSA client/port-number suffixes.
; Example: APC40 mkII
ControlInput=APC40 mkII
ControlOutput=APC40 mkII

; Brightness of the 40 RGB Matrix/sequence pads. Accepted range: 0-100.
; Invalid or missing values use 100; values outside the range are clamped.
APC40RGBBrightness=100

; Per-track fader ceiling. 100 locks trims at unity; 200 keeps full boost.
; Accepted range: 100-200. Invalid or missing values use 200.
TrackTrimMaxPercent=200

; Width of each onscreen stored-trim strip in logical interface pixels.
; Accepted range: 0-8. Set 0 to hide the strips. Invalid values use 2.
TrackTrimDisplayWidth=2

; Cue Level/Crossfader strum: Latched, Momentary, ManualPingPong or Off.
; Momentary is a forward one-shot. ManualPingPong plays forward on a forward
; sweep and backward on a reverse sweep. Both ignore sample loops and decay to
; the natural sample boundary.
PatternJogAudition=Latched

; FastTracks channels during Cue Level/Crossfader strumming: Ignore or Include.
; Ignore preserves private-head isolation. Include strums the visible ordinary
; row on those channels without changing their FastTracks assignments.
PatternJogFastTracks=Ignore

; APC footswitch Transport Punch freezes every automatic transport while the
; mixer keeps sounding. Sustain preserves voices; Cut silences them on entry.
TransportFreezeAudio=Sustain

; Toggle punches on/off with successive presses; Hold freezes while depressed.
TransportFreezePedalMode=Toggle

; While frozen, Up/Down can relocate silently or audition destination row 00.
; An auditioned row is consumed, so release continues from the following row.
TransportFreezeNavigation=Silent

; What happens when Transport Punch resumes without a later manual relocation:
; Next continues after the already-heard frozen row. Retrigger plays it again.
TransportFreezeResume=Next

[MIDI_MAP]

; Format: Message.MIDIChannel.Number=Action[:Argument]
; MIDI channels, tracker tracks, Matrix banks and slots are all 1-based.
; Uncomment examples and enable PerformanceControl to try them.
;NoteOn.1.48=TrackPerformanceMuteToggle:1
;NoteOn.1.49=PerformanceUnmuteNext
;NoteOn.1.50=PerformanceMutePrevious
;NoteOn.1.51=MatrixModeToggle
;NoteOn.1.52=MatrixBankNext
;NoteOn.1.53=MatrixSlotTrigger:1
;CC.1.7=TrackTrim:1
;CC.1.48=FastTrackRatio:1

