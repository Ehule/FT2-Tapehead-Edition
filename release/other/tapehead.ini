; Tapehead Edition advanced configuration
; Changes are loaded when the program starts.
; Invalid or missing values use the safe built-in defaults.

[Video]

; Experimental crisp HD renderer. The layout and mouse map stay exactly
; 632x400, but the final image is rebuilt at 2x or 3x resolution.
; Disable this here if the HD window is unsuitable for the current display.
HDMode=false

; Accepted values: 2 or 3. The window is safely reduced if it cannot fit.
HDScale=3

; crisp keeps FT2's square geometry while applying restrained diagonal cleanup.
; round restores the softer HD v1 filter. The old sharp name is accepted as
; an alias for crisp so existing experimental configurations remain valid.
; Accepted values: crisp, sharp or round.
HDStyle=crisp

[Launcher]

; Open directly into the combined Pattern/Sample launcher deck.
Enabled=true

[Keyboard]

; Backspace navigates to the parent directory while Disk Op is open.
DiskOpBackspaceParent=false

; Backspace deletes the current note row and pulls later notes upward.
PatternBackspacePullUp=false

[Audio]

; Logical stereo output buses requested from the selected audio device or
; exposed as separate ports by "Tapehead JACK Virtual Outputs" on Linux.
; 1 is ordinary stereo; accepted range is 1-16 (2-32 output channels).
; Unsupported multichannel modes safely fall back to stereo.
OutputBuses=1

; Route each tracker lane to one physical mono output instead of a stereo bus.
; The Config -> Audio checkbox can also change this while FT2 is running.
MonoOutputs=false

[Undo]

; Undo history memory ceiling in megabytes (accepted range: 4-1024).
UndoMemoryMB=32
